name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Configure, build, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Keep the build tree so logs can be uploaded when the check fails.
      APL1_CHECK_BUILD_DIR: ci-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            libcriterion-dev \
            libnotcurses-dev \
            libsqlite3-dev \
            pkg-config \
            python3 \
            python3-pip
          # The project requires CMake 4.2+, newer than the Ubuntu package.
          python3 -m pip install --break-system-packages "cmake>=4.2"

      - name: Show toolchain versions
        run: |
          cmake --version
          gcc --version | head -1
          python3 --version

      - name: Run clean check
        run: scripts/check.sh

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: |
            ci-build/Testing/Temporary/
            ci-build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
