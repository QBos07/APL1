name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, build, and test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Keep the build tree so logs can be uploaded when a step fails.
      APL1_CHECK_BUILD_DIR: ci-build
      APL1_CHECK_CMAKE_ARGS: -DAPL1_ENABLE_TUI_SMOKE=ON
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang-format \
            clang-tidy \
            cmake \
            git \
            libcriterion-dev \
            libnotcurses-dev \
            libsqlite3-dev \
            pkg-config \
            python3 \
            xfonts-base \
            xterm \
            xdotool \
            xvfb

      - name: Show toolchain versions
        run: |
          cmake --version
          gcc --version | head -1
          clang-format --version
          clang-tidy --version | head -1
          python3 --version

      - name: Check formatting
        run: scripts/check-format.sh

      - name: Static analysis
        run: scripts/check-static.sh

      - name: Configure, build, and test (including TUI smoke)
        run: scripts/check.sh

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-logs
          path: |
            ci-build/Testing/Temporary/
            ci-build/CMakeFiles/CMakeConfigureLog.yaml
            ci-build/apl1-tui-smoke.log
          if-no-files-found: ignore
          retention-days: 7

  clang:
    name: Clang build and tests
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            git \
            libcriterion-dev \
            libnotcurses-dev \
            libsqlite3-dev \
            pkg-config

      - name: Configure, build, and test
        run: |
          cmake -S . -B build-clang -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=clang
          cmake --build build-clang --parallel
          ctest --test-dir build-clang --output-on-failure

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            libcriterion-dev \
            libnotcurses-dev \
            libsqlite3-dev \
            pkg-config

      - name: Configure, build, and test
        run: |
          cmake -S . -B build-sanitize -DBUILD_TESTING=ON \
            -DENABLE_ASAN=ON -DENABLE_UBSAN=ON
          cmake --build build-sanitize --parallel
          ctest --test-dir build-sanitize --output-on-failure
