# Standard apl1 check: configure, build, and CTest through scripts/check.sh.
# The TUI smoke test stays opt-in and is not part of this headless job.

stages:
  - check

apl1-check:
  stage: check
  image: ubuntu:24.04
  variables:
    # Keep the build tree so the artifacts below survive a failure.
    APL1_CHECK_BUILD_DIR: ci-build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  before_script:
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
        build-essential
        ca-certificates
        git
        libcriterion-dev
        libnotcurses-dev
        libsqlite3-dev
        pkg-config
        python3
        python3-pip
    # The project requires CMake 4.2+, which is newer than the Ubuntu package.
    - python3 -m pip install --break-system-packages "cmake>=4.2"
    - cmake --version
    - gcc --version | head -1
  script:
    - scripts/check.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ci-build/Testing/Temporary/
      - ci-build/CMakeFiles/CMakeConfigureLog.yaml
